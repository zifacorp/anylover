name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check
        run: python -m compileall -q src tests

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test
        shell: bash
        run: |
          export ANYLOVER_HOME="$(mktemp -d)"
          anylover init --name Any
          anylover companion
          anylover remember "CI smoke preference" \
            --kind preference \
            --consent routine \
            --surface ci
          anylover list
          anylover context --query "CI smoke preference"

      - name: Installer dry run
        run: bash install.sh --dry-run --agent all

  portable-skills:
    name: Portable Skill install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify Skills CLI distribution and standalone runtime
        run: python scripts/verify_skills_install.py
